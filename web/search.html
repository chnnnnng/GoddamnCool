<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}} · 网盘资源搜索</title>
<link rel="stylesheet" href="/static/css/common.css">
<link rel="stylesheet" href="/static/css/search.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/search"><span class="dot"></span>{{APP_NAME}}</a>
  <span class="spacer"></span>
  <a class="button sec" href="/panel">控制面板</a>
</header>
<main>
  <div class="searchbar">
    <input id="kw" placeholder="输入片名 / 剧名 / 关键词，搜索网盘分享资源" enterkeyhint="search">
    <button id="btn">搜索</button>
  </div>
  <div class="chips" id="diskchips"><span class="lbl">网盘</span></div>
  <div class="chips" id="alivechips"><span class="lbl">存活</span></div>
  <div id="meta" class="meta"></div>
  <div id="list" class="grid"></div>
  <div id="msg" class="msg"></div>
  <div class="meta foot" id="foot"></div>
</main>
<div id="modal" class="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true">
    <div class="mhead">
      <span class="mtitle" id="mtitle"></span>
      <button class="sec mclose" id="mclose" type="button">关闭</button>
    </div>
    <div class="mbody" id="mbody"></div>
  </div>
</div>
<script src="/static/js/common.js"></script>
<script src="/static/js/spatial-nav.js"></script>
<script src="/static/js/search.js"></script>
</body>
</html>
