<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网盘资源搜索</title>
<link rel="stylesheet" href="/static/css/common.css">
<link rel="stylesheet" href="/static/css/search.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/search"><span class="dot"></span>夸克搜转</a>
  <span class="spacer"></span>
  <a class="button sec" href="/setup">账号绑定</a>
</header>
<main>
  <div class="searchbar">
    <input id="kw" placeholder="输入片名 / 剧名 / 关键词，搜索网盘分享资源" enterkeyhint="search">
    <button id="btn">搜索</button>
  </div>
  <div class="chips" id="diskchips"><span class="lbl">网盘</span></div>
  <div class="chips" id="alivechips"><span class="lbl">存活</span></div>
  <div id="meta" class="meta"></div>
  <div id="list" class="grid"></div>
  <div id="msg" class="msg"></div>
  <div class="meta foot" id="foot"></div>
</main>
<script src="/static/js/common.js"></script>
<script src="/static/js/spatial-nav.js"></script>
<script src="/static/js/search.js"></script>
</body>
</html>
