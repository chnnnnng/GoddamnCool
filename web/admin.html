<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · {{APP_NAME}}</title>
<link rel="stylesheet" href="/static/css/common.css">
<link rel="stylesheet" href="/static/css/account.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/search"><span class="dot"></span>{{APP_NAME}}</a>
  <span class="spacer"></span>
  <a class="button sec" href="/panel">控制面板</a>
  <button type="button" class="sec" id="btn-logout">登出</button>
</header>
<main>
  <!-- 用户管理 -->
  <div class="card">
    <h1>用户管理</h1>
    <p class="meta">升级/降级、禁用/启用、重置密码与删除；不能对自己降权、禁用或删除。</p>
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>邮箱</th><th>角色</th><th>级别</th><th>网盘</th>
            <th>今日搜索</th><th>今日转存</th><th>任务</th>
            <th>注册时间</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="user-rows">
          <tr><td colspan="9" class="meta">加载中…</td></tr>
        </tbody>
      </table>
    </div>
    <form id="form-newuser">
      <h1 style="font-size:1rem;margin-top:18px">新建用户</h1>
      <div class="row">
        <input id="nu-email" type="email" placeholder="邮箱">
        <input id="nu-pass" type="password" minlength="8" placeholder="密码（至少 8 位）">
        <select id="nu-tier"><option value="lite">Lite</option><option value="pro">Pro</option></select>
        <select id="nu-role"><option value="user">用户</option><option value="admin">管理员</option></select>
        <button type="submit">创建</button>
      </div>
    </form>
  </div>

  <!-- 运行时配置 -->
  <div class="card">
    <h1>运行时配置</h1>
    <p class="meta">保存后立即生效（含 TMDB API Key，普通用户不可见）。</p>
    <div id="config-rows">加载中…</div>
    <button type="button" id="cfg-save">保存配置</button>
  </div>

  <p id="msg" class="msg"></p>
</main>
<script src="/static/js/common.js"></script>
<script src="/static/js/admin.js"></script>
</body>
</html>
